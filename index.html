<!DOCTYPE html>

<html lang="de">

<head>
    <meta charset="UTF-8">

    <!-- Wichtig für Smartphones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verleihliste</title>

    <!-- Verbindung zur CSS-Datei -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- =========================
         Kopfbereich der Webseite
         ========================= -->

    <header class="page-header">

        <h1>Meine Verleihliste</h1>

        <p>
            Gegenstände, die Freunde und Bekannte bei mir ausleihen können.
        </p>

        <!-- Platzhalter für spätere Inhalte -->
        <div class="header-placeholder">
            Platzhalter für weitere Informationen
        </div>

    </header>



    <!-- =========================
         Hauptbereich
         ========================= -->

    <main>

        <div class="table-container">

            <table class="loan-table">

                <!-- Spaltenüberschriften -->
                <thead>

                    <tr>
                        <th>Kategorie</th>
                        <th>Name</th>
                        <th>Bild</th>
                        <th>Bezeichnung</th>
                        <th>Status</th>
                        <th>Ausleihe</th>
                        <th>Anmerkung</th>
                    </tr>

                </thead>


                <!-- Verleihobjekte -->
                <tbody id="items-body">

                    <tr>
                        <td colspan="7">
                            Gegenstände werden geladen ...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </main>



    <!-- JavaScript kommt später -->
    <!-- <script src="script.js"></script> -->
<!-- =========================
     Ausleihdialog
     ========================= -->

<div id="request-modal" class="modal">

    <div class="modal-content">

        <button
            id="modal-close"
            class="modal-close"
            type="button"
            aria-label="Fenster schließen"
        >
            &times;
        </button>


        <h2>Ausleihe anfragen</h2>

        <p id="modal-item-name" class="modal-item-name"></p>


        <form id="request-form">

            <!-- Name: Pflichtfeld -->

            <label for="borrower-name">
                Name *
            </label>

            <input
                type="text"
                id="borrower-name"
                name="borrower-name"
                required
                autocomplete="name"
            >


            <!-- Anmerkung: optional -->

            <label for="request-note">
                Anmerkung
            </label>

            <textarea
                id="request-note"
                name="request-note"
                rows="4"
                placeholder="Optional: Zeitraum, Zubehörwünsche etc."
            ></textarea>


            <!-- Buttons -->

            <div class="modal-actions">

                <button
                    type="button"
                    id="cancel-button"
                    class="secondary-button"
                >
                    Abbrechen
                </button>

                <button
                    type="submit"
                    class="submit-button"
                >
                    Senden
                </button>

            </div>

        </form>

    </div>

</div>


<!-- Supabase JavaScript-Bibliothek -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Unser eigener JavaScript-Code -->
<script src="script.js"></script>
</body>

</html>
