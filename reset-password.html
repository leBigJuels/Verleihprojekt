<!DOCTYPE html>

<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Passwort ändern – Verleihliste</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="page-header">
        <h1>Passwort ändern</h1>

        <p>Admin-Passwort sicher über Supabase aktualisieren.</p>

        <a href="admin.html">Zurück zum Adminbereich</a>
    </header>


    <main class="admin-container">
        <section class="admin-card password-card">
            <form id="password-form" class="admin-login-form">
                <div id="regular-login-fields" class="form-field-group">
                    <label for="password-email">E-Mail-Adresse</label>
                    <input
                        id="password-email"
                        type="email"
                        autocomplete="username"
                        required
                    >

                    <label for="current-password">Aktuelles Passwort</label>
                    <input
                        id="current-password"
                        type="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <label for="new-password">Neues Passwort</label>
                <input
                    id="new-password"
                    type="password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <label for="repeat-password">Neues Passwort wiederholen</label>
                <input
                    id="repeat-password"
                    type="password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button id="change-password-button" class="submit-button" type="submit">
                    Passwort ändern
                </button>

                <p id="password-message" class="admin-message"></p>
            </form>


            <div id="recovery-area" class="recovery-area">
                <p>Aktuelles Passwort vergessen?</p>

                <button id="send-recovery-button" class="secondary-button" type="button">
                    Wiederherstellungs-E-Mail senden
                </button>
            </div>
        </section>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="reset-password.js"></script>

</body>

</html>
